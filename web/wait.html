<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>TabDeck</title>
<style>
html,body{margin:0;height:100%;background:#101418;color:#e6e9ee;font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:-webkit-box;display:flex;-webkit-box-align:center;align-items:center;-webkit-box-pack:center;justify-content:center;text-align:center}
.box{padding:24px;max-width:420px}
h1{font-size:18px;font-weight:600;margin:0 0 18px;color:#9aa4b2;letter-spacing:.08em;text-transform:uppercase}
.code{font-size:64px;font-weight:700;letter-spacing:.18em;margin:0 0 18px;color:#ffd166}
p{font-size:16px;line-height:1.45;margin:0;color:#c9d0da}
.locked .code,.refused .code{color:#ef476f;font-size:40px}
</style></head>
<body class="__STATE__"><div class="box">
<h1>TabDeck</h1>
<div class="code" id="code">__CODE__</div>
<p>__MSG__</p>
</div>
<script>
(function () {
  var TOKEN = "__TOKEN__", STATE = "__STATE__";
  if (STATE !== "pending") { setTimeout(function () { location.reload(); }, 60000); return; }
  function poll() {
    var x = new XMLHttpRequest();
    x.open("GET", "/devstate?_=" + Date.now(), true);
    x.setRequestHeader("X-Token", TOKEN);
    x.timeout = 4000;
    x.onreadystatechange = function () {
      if (x.readyState !== 4) { return; }
      var s = null;
      try { s = JSON.parse(x.responseText); } catch (e) {}
      if (s && s.state !== "pending") { location.reload(); return; }
      if (s && s.code) { document.getElementById("code").textContent = s.code; }
      setTimeout(poll, 2000);
    };
    try { x.send(); } catch (e) { setTimeout(poll, 2000); }
  }
  setTimeout(poll, 2000);
})();
</script>
</body></html>
